[package]
name = "syncai_robot_3d_mapping"
version = "0.1.0"
edition = "2024"

[[bin]]                         # one [[bin]] per node; this is the name `ros2 run` uses
name = "mapping_node"
path = "src/main.rs"

[dependencies]
rclrs = "0.8"
# Pinned to 0.2 to match syncai_robot_state / syncai_driver_manager; rclrs uses 0.3 internally and
# the two crates' message types are NOT interchangeable, so never pass a type from one to an API of
# the other.
ros-env = "0.2"

# Install launch/ and params/ into share/syncai_robot_3d_mapping/ so the launch file finds them
[package.metadata.ros]
install_to_share = ["launch", "params"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
