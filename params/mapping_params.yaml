# pgo_node parameters (syncai_mapping). README's parameter tables have the rationale.
#
# Loaded by mapping.launch.py; `/**/pgo_node:` keeps the file namespace-independent
# (the node runs at /<robot_id>/pgo). Inputs, frames and the LIO reset service are
# derived from that namespace, not set here. The launch overrides map_cloud_dir
# (appends /<robot_id>) and start_on_launch.
#
# Types matter: tuning values are doubles (always with a decimal point) except the
# keys marked `# int`. A wrong type kills the node at startup with
# InvalidParameterTypeException.
#
# Read once at startup (and copied again on reset_mapping): `ros2 param set` does nothing.
/**/pgo_node:
  ros__parameters:
    # Keyframe selection: a new keyframe every 10 deg or 0.5 m of travel.
    keyframe_delta_deg: 10.0
    keyframe_delta_m: 0.5
    # Loop closure: radius search over keyframes >= loop_time_tresh s apart,
    # GICP against a +-loop_submap_half_range keyframe submap; rejected above
    # loop_score_tresh (mean squared distance over the overlap).
    loop_search_radius: 1.0
    loop_time_tresh: 60.0
    loop_score_tresh: 0.15
    # Max GICP correspondence distance, m (the fork's 10 let far,
    # non-overlapping points steer the alignment).
    loop_gicp_max_corr_dist: 1.0
    loop_gicp_num_threads: 4       # int
    loop_gicp_num_neighbors: 20    # int
    # true: loop edge on world-frame x / y / yaw only (PlanarLoopFactor), z /
    # roll / pitch left to the odometry. false: the fork's 6-DOF BetweenFactor.
    loop_planar_correction: true
    # planar false only: BetweenFactor variance on roll / pitch / z
    # (x / y / yaw use the registration fitness).
    loop_noise_var_roll_pitch_z: 0.01
    # planar true only: loop yaw sigma, deg. <= 0 = variance = fitness, which
    # the odometry edges outvote.
    loop_noise_yaw_sigma_deg: 1.5
    # planar true only: loop x / y sigma, m. <= 0 = variance = fitness.
    loop_noise_xy_sigma_m: 0.05
    # Per-keyframe roll / pitch prior to Point-LIO's gravity-aligned value, deg.
    # Without it a yaw correction leaks into pitch and the chain climbs or sinks.
    # <= 0 = off.
    keyframe_tilt_sigma_deg: 0.5
    loop_submap_half_range: 5     # int
    loop_submap_resolution: 0.1   # m
    loop_search_period: 5.0       # s between loop searches
    # Robust kernel on loop factors: huber / cauchy / none. Scale in sigmas;
    # a correct loop settles near 3, so 5 only bounds a wrong one.
    loop_robust_kernel: huber
    loop_robust_kernel_scale: 5.0
    # Post-GICP gates over the overlap (source points within
    # loop_gicp_max_corr_dist): its share of the scan, and the share of it
    # within loop_inlier_dist (m). Candidates are logged as
    # "[PGONode][loop] candidate ..."; calibrate on a replay.
    loop_inlier_dist: 0.2
    loop_min_overlap_ratio: 0.3
    loop_min_inlier_ratio: 0.6
    # Corridor degeneracy gate (min / max eigenvalue of the x / y information,
    # logged as "xy info"). <= 0 = off until calibrated.
    loop_min_xy_info_ratio: 0.0
    # Max loop correction as a fraction of the path between its two keyframes
    # (floored at loop_search_radius); rejects look-alike places. <= 0 = off.
    loop_max_drift_ratio: 0.05
    # Radius search reach. true: per candidate, the drift gate's bound above,
    # capped at loop_search_radius + 3 * loop_gicp_max_corr_dist (what the
    # coarse GICP stage can pull in); farther candidates go coarse to fine.
    # false: loop_search_radius only, so drift beyond 1 m never closes a loop.
    loop_radius_drift_scaled: true
    loop_max_candidates: 3        # int; radius candidates verified per search
    # Scan Context: global candidates when the radius search accepts nothing.
    # Off until validated on this site's replays (indoor look-alikes).
    loop_sc_enabled: false
    loop_sc_max_range: 20.0       # m, descriptor radius
    loop_sc_dist_tresh: 0.2       # descriptor distance; lower = stricter

    # "Map so far" merge on pgo/map_cloud (rviz) and pgo/map_cloud_file (backend).
    map_cloud_resolution: 0.2   # voxel leaf (m) of the published merge
    map_cloud_pub_period: 3.0   # min seconds between publishes
    # Base dir of the PCD hand-off to the backend (the launch appends /<robot_id>).
    # Must be a tmpfs both containers share: the host's /dev/shm with `ipc: host`.
    map_cloud_dir: /dev/shm/syncai_pgo
    # true: map from launch without pgo/start_mapping (bag replays only).
    start_on_launch: false

    # Post-save map cleaning: after save_maps with save_patches, a detached
    # `clean_map <dir>` replaces map.pcd without dynamic voxels (people) and
    # sparse ones (one-off returns). See README "Cleaning map.pcd".
    map_clean_enabled: true
    map_clean_voxel_size: 0.1        # voxel edge, m
    map_clean_max_range: 20.0        # judging range, not the lidar's; farther points are kept, m
    map_clean_min_range: 0.5         # the robot's own body, m
    map_clean_lidar_height: 0.481    # keyframe z minus this is the floor, m
    map_clean_floor_band: 0.25       # +- m around the floor where neither rule applies
    # Above this the dynamic rule applies inside the floor band too (feet), m.
    map_clean_floor_band_dynamic: 0.1
    map_clean_dynamic_max_height: 2.0  # people are looked for up to floor + this, m
    map_clean_floor_radius: 10.0     # keyframes within this give a cell its floor, m
    map_clean_sparse_min_hits: 2     # int; <= 1 turns the sparse rule off
    map_clean_dynamic_miss_ratio: 2.0
    map_clean_dynamic_min_miss: 3    # int; <= 0 turns the dynamic rule off
    # Cut rays below the floor so reflections off a glossy floor count no misses.
    map_clean_clip_below_floor: true
    # Also write octomap.bt for octomap_planner's 3D paths. Most of the memory when on.
    # Only the default: a save_maps call that sets octomap ON or OFF decides for itself.
    map_clean_octomap: false
    # Close enclosed floor gaps in octomap.bt (only) within this of the path, m.
    # <= 0 = off.
    map_clean_floor_fill_radius: 3.0
    map_clean_nice: 10               # int
